name: Format adaptive context

on:
  push:
    branches:
      - decision-engine-integration
    paths:
      - ".github/workflows/format-adaptive-context.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: decision-engine-integration
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prettier lib/tools.js benchmark/context-packing/run.js --write
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/tools.js benchmark/context-packing/run.js
          git commit -m "Format adaptive context changes"
          git push origin HEAD:decision-engine-integration
