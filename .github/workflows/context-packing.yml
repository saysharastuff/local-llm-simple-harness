name: Context packing benchmark

on:
  push:
    branches:
      - decision-engine-integration
    paths:
      - ".github/workflows/context-packing.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HARNESS_DECISION_URL: https://sayshara-decision-engine.hf.space

    steps:
      - uses: actions/checkout@v4
        with:
          ref: decision-engine-integration

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Run context packing benchmark
        run: |
          node benchmark/context-packing/run.js \
            benchmark/context-packing/manifest.json \
            context-packing-results.json

      - name: Build summary
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const data = JSON.parse(
            fs.readFileSync("context-packing-results.json", "utf8"),
          );
          const pct = (value) => (value * 100).toFixed(1) + "%";
          const lines = [
            "# Context packing benchmark",
            "",
            "| Metric | Whole query | Facet lexical | Facet semantic |",
            "|---|---:|---:|---:|",
            `| Evidence recall | ${pct(data.metrics.wholeQueryEvidenceRecall)} | ${pct(data.metrics.facetAwareEvidenceRecall)} | ${pct(data.metrics.semanticFacetEvidenceRecall)} |`,
            `| Noise rate | ${pct(data.metrics.wholeQueryNoiseRate)} | ${pct(data.metrics.facetAwareNoiseRate)} | ${pct(data.metrics.semanticFacetNoiseRate)} |`,
            `| Mean packed tokens | ${data.metrics.wholeQueryMeanTokens.toFixed(1)} | ${data.metrics.facetAwareMeanTokens.toFixed(1)} | ${data.metrics.semanticFacetMeanTokens.toFixed(1)} |`,
            "",
            "| Scenario | Whole recall | Lexical facet | Semantic facet | Whole noise | Semantic noise |",
            "|---|---:|---:|---:|---:|---:|",
          ];
          for (const item of data.scenarios) {
            lines.push(
              `| ${item.id} | ${pct(item.wholeQuery.evidenceRecall)} | ${pct(item.facetAware.evidenceRecall)} | ${pct(item.semanticFacetAware.evidenceRecall)} | ${pct(item.wholeQuery.noiseRate)} | ${pct(item.semanticFacetAware.noiseRate)} |`,
            );
          }
          fs.writeFileSync(
            "context-packing-summary.md",
            lines.join("\n") + "\n",
          );
          NODE
          cat context-packing-summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: context-packing-results
          path: |
            context-packing-results.json
            context-packing-summary.md
          retention-days: 14
