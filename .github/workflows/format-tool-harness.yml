name: Format tool harness

on:
  push:
    branches:
      - decision-engine-integration
    paths:
      - ".github/workflows/format-tool-harness.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: decision-engine-integration
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prettier benchmark/tool-routing/manifest.json lib/tools.js README.md tool.js --write
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmark/tool-routing/manifest.json lib/tools.js README.md tool.js
          git commit -m "Format tool harness files"
          git push origin HEAD:decision-engine-integration
